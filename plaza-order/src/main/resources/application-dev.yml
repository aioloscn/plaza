config:
  nacos:
    host: ${NACOS_HOST:127.0.0.1}:18848
    username: nacos
    password: nacos

spring:
  cloud:
    nacos:
      username: ${config.nacos.username}
      password: ${config.nacos.password}
      discovery:
        server-addr: ${config.nacos.host}
        namespace: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/plaza?serverTimezone=UTC&useSSL=false&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      shop:
        host: ${REDIS_HOST:127.0.0.1}
        port: 6379
        database: 2
        lettuce:
          pool:
            max-active: 10
            max-idle: 5
            min-idle: 1
      cart:
        host: ${REDIS_HOST:127.0.0.1}
        port: 6379
        database: 3
        lettuce:
          pool:
            max-active: 10
            max-idle: 5
            min-idle: 1

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl