config:
  nacos:
    host: ${NACOS_HOST:127.0.0.1}:18848
    username: nacos
    password: nacos

spring:
  cloud:
    nacos:
      username: ${config.nacos.username}
      password: ${config.nacos.password}
      discovery:
        server-addr: ${config.nacos.host}
        namespace: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/plaza?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      shop:
        host: ${REDIS_HOST:127.0.0.1}
        port: 6379
        database: 2
        lettuce:
          pool:
            max-active: 10
            max-idle: 5
            min-idle: 1
      order:
        host: ${REDIS_HOST:127.0.0.1}
        port: 6379
        database: 3
        lettuce:
          pool:
            max-active: 10
            max-idle: 5
            min-idle: 1

alipay:
  app-id: 9021000162625173
  merchant-private-key: 
  alipay-public-key: 
  notify-url: https://leann-wicked-apocalyptically.ngrok-free.dev/plaza-order/order/pay/notify # 必须是公网可访问的地址
  return-url: http://plaza.aiolos.com:3000/pay/success # 支付成功后的跳转地址
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  sign-type: RSA2
  charset: utf-8
  format: json

xxl:
  job:
    admin:
      addresses: http://127.0.0.1:18089/xxl-job-admin
    accessToken: default_token
    executor:
      appname: plaza-order-executor
      address:
      ip:
      port: 19999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
