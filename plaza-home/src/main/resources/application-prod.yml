config:
  nacos:
    host: ${NACOS_HOST:127.0.0.1}:18848
    username: nacos
    password: nacos
  canal:
    host: 127.0.0.1
    port: 11111
    destination: example
    username: canal
    password: canal

spring:
  cloud:
    nacos:
      username: ${config.nacos.username}
      password: ${config.nacos.password}
      discovery:
        server-addr: ${config.nacos.host}
        namespace: public
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/plaza?serverTimezone=UTC&useSSL=false&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      port: 6379
      host: ${REDIS_HOST:127.0.0.1}
      database: 2
      lettuce:
        pool:
          min-idle: 1
          max-idle: 5
          max-active: 10

xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:18089/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      appname: ${XXL_JOB_EXECUTOR_APPNAME:plaza-home-executor}
      address:
      ip:
      port: ${XXL_JOB_EXECUTOR_PORT:19201}
      logpath: ${XXL_JOB_LOG_PATH:/data/applogs/xxl-job/jobhandler}
      logretentiondays: ${XXL_JOB_LOG_RETENTION_DAYS:30}

home:
  user-profile:
    job:
      lookback-days: ${HOME_USER_PROFILE_JOB_LOOKBACK_DAYS:180}
      max-users: ${HOME_USER_PROFILE_JOB_MAX_USERS:1500}
